<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Osobný blog - Formulár</title>
    <!-- Bootstrap CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Vlastné CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Komentár: Navbar (navbar, navbar-expand-md, fixed-top, bg-dark, navbar-dark) - fixné menu zhodné s index.html -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">Môj Osobný Blog</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Prepnúť navigáciu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Domov</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="form.html">Kontakt / Dotazník</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Komentár: Hlavný obsah formulára (container, my-5) -->
    <main class="container my-5">
      <section class="p-4 bg-light rounded shadow-sm">
        <h2>Kontaktný formulár</h2>
        <p class="zvyraznene">
          Prosím, vyplňte nasledujúci formulár pre odoslanie správy.
        </p>

        <!-- Formulár s metódou GET -->
        <form action="" method="get">
          <!-- Komentár: Skupina poľa (mb-3, form-label, form-control) - obal mb-3 zabezpečuje vertikálny odstup, form-label štýluje popis, form-control štýluje textový vstup -->
          <div class="mb-3">
            <label for="meno" class="form-label">Meno a priezvisko:</label>
            <input
              type="text"
              class="form-control"
              id="meno"
              name="meno"
              required
            />
          </div>

          <!-- Email pole -->
          <div class="mb-3">
            <label for="email" class="form-label">E-mailová adresa:</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              required
            />
          </div>

          <!-- Číselné pole -->
          <div class="mb-3">
            <label for="vek" class="form-label">Vek:</label>
            <input
              type="number"
              class="form-control"
              id="vek"
              name="vek"
              min="1"
              max="120"
              required
            />
          </div>

          <!-- Dátumové pole -->
          <div class="mb-3">
            <label for="datum" class="form-label">Dátum návštevy:</label>
            <input type="date" class="form-control" id="datum" name="datum" />
          </div>

          <!-- Výber z možností (form-select) -->
          <div class="mb-3">
            <label for="kategoria" class="form-label">Kategória záujmu:</label>
            <select
              class="form-select"
              id="kategoria"
              name="kategoria"
              required
            >
              <option value="">-- vyber --</option>
              <option value="web">Webový vývoj</option>
              <option value="design">Dizajn</option>
              <option value="ine">Iné</option>
            </select>
          </div>

          <!-- Komentár: Skupina rádio tlačidiel (fieldset, fs-6, form-check, form-check-input, form-check-label) -->
          <fieldset class="mb-3">
            <legend class="fs-6 fw-bold">Spokojnosť so stránkou:</legend>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="spokojnost"
                id="spokojnost_vyborna"
                value="vyborna"
                checked
              />
              <label class="form-check-label" for="spokojnost_vyborna"
                >Výborná</label
              >
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="spokojnost"
                id="spokojnost_priemerna"
                value="priemerna"
              />
              <label class="form-check-label" for="spokojnost_priemerna"
                >Priemerná</label
              >
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="spokojnost"
                id="spokojnost_zlata"
                value="zla"
              />
              <label class="form-check-label" for="spokojnost_zlata">Zlá</label>
            </div>
          </fieldset>

          <!-- Checkboxy (viacero možností so zátvorkami v name) -->
          <div class="mb-3">
            <label class="form-label fw-bold">Odoberať novinky:</label>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                name="zaujem[]"
                value="newsletter"
                id="zaujem_newsletter"
              />
              <label class="form-check-label" for="zaujem_newsletter"
                >E-mailový newsletter</label
              >
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                name="zaujem[]"
                value="notifikacie"
                id="zaujem_notifikacie"
              />
              <label class="form-check-label" for="zaujem_notifikacie"
                >SMS notifikácie</label
              >
            </div>
          </div>

          <!-- Obľúbená farba -->
          <div class="mb-3">
            <label for="oblubena_farba" class="form-label"
              >Obľúbená farba:</label
            >
            <input
              type="color"
              class="form-control form-control-color"
              id="oblubena_farba"
              name="oblubena_farba"
              value="#3498db"
              title="Vyberte farbu"
            />
          </div>

          <!-- Textarea -->
          <div class="mb-3">
            <label for="sprava" class="form-label">Správa:</label>
            <textarea
              class="form-control"
              id="sprava"
              name="sprava"
              rows="4"
            ></textarea>
          </div>

          <!-- Samostatný checkbox (súhlas) -->
          <div class="mb-3 form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="suhlas"
              name="suhlas"
              value="ano"
              required
            />
            <label class="form-check-label" for="suhlas"
              >Súhlasím so spracovaním údajov</label
            >
          </div>

          <!-- Tlačidlo odoslania (btn, btn-primary) -->
          <button type="submit" class="btn btn-primary">
            Odoslať formulár
          </button>
        </form>
      </section>
    </main>

    <!-- Komentár: Pätička -->
    <footer class="bg-dark text-white text-center py-3 mt-4">
      <div class="container">
        <p class="mb-0">
          &copy; 2026 Mykhailo Perepichai. Všetky práva vyhradené.
        </p>
      </div>
    </footer>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
